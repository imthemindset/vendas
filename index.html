<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindset | Links</title>
<meta name="description" content="Vendas de ticket alto: guia e reunião comigo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#171512;
    --border:#2a2622;
    --text:#f2efe9;
    --text-muted:#9a958c;
    --gold:#b08d57;
    --gold-bright:#d4b483;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:64px 20px 40px;
    -webkit-font-smoothing:antialiased;
  }
  /* fundo com leve textura radial pra não ficar chapado */
  body{
    background-image:radial-gradient(circle at 50% 0%, #161310 0%, #0a0a0a 55%);
  }
  .page{width:100%;max-width:440px;text-align:center;}

  .avatar{
    width:84px;height:84px;
    margin:0 auto 20px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:900;
    font-size:34px;
    color:var(--gold);
    background:var(--surface);
  }
  .brand{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:800;
    font-size:26px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .brand span{color:var(--gold);}
  .tagline{
    margin-top:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--text-muted);
    letter-spacing:0.04em;
  }

  .links{margin-top:38px;display:flex;flex-direction:column;gap:16px;}

  .link-btn{
    display:block;
    text-decoration:none;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 22px;
    text-align:left;
    transition:transform .15s ease, border-color .2s ease, background .2s ease;
    position:relative;
  }
  .link-btn:hover{
    transform:translateY(-2px);
    border-color:var(--gold);
  }
  .link-btn.featured{
    background:var(--gold);
    border-color:var(--gold);
  }
  .link-btn.featured:hover{background:var(--gold-bright);}
  .link-btn.featured .link-title,
  .link-btn.featured .link-sub{color:#141210;}

  .link-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:6px;
  }
  .link-btn.featured .link-eyebrow{color:#3d3126;}

  .link-title{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:800;
    font-size:21px;
    text-transform:uppercase;
    letter-spacing:0.01em;
    line-height:1.1;
  }
  .link-sub{
    margin-top:6px;
    font-size:13.5px;
    color:var(--text-muted);
  }
  .link-price{
    position:absolute;
    top:20px;right:22px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    color:var(--gold);
  }
  .link-btn.featured .link-price{color:#141210;}
  .arrow{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--gold);
    margin-top:10px;
    display:inline-block;
  }
  .link-btn.featured .arrow{color:#141210;}

  .divider{
    margin:34px 0 22px;
    display:flex;align-items:center;gap:14px;
    color:var(--text-muted);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .divider::before,.divider::after{
    content:'';flex:1;height:1px;background:var(--border);
  }

  .social{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--text-muted);
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    border:1px solid var(--border);
    padding:11px 20px;
    border-radius:100px;
    transition:all .2s ease;
  }
  .social:hover{border-color:var(--gold);color:var(--gold-bright);}

  footer{
    margin-top:48px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:#5c584f;
  }
</style>
</head>
<body>
<div class="page">

  <div class="avatar">M</div>
  <div class="brand">MINDSET<span>.</span></div>
  <div class="tagline">VENDAS ALTO TICKET</div>

  <div class="links">

    <a href="#" id="linkReuniao" class="link-btn featured">
      <span class="link-eyebrow">Fale comigo</span>
      <div class="link-title">Quero vender mais</div>
      <div class="link-sub">Entenda onde seu time está perdendo venda</div>
      <span class="arrow">Abrir →</span>
    </a>

    <a href="#" id="linkEbook" class="link-btn">
      <span class="link-price">R$19,90</span>
      <span class="link-eyebrow">Guia digital</span>
      <div class="link-title">Feche mais reuniões de ticket alto</div>
      <div class="link-sub">O método testado com +1000 fechamentos</div>
      <span class="arrow">Ver guia →</span>
    </a>

  </div>

  <div class="divider">redes</div>

  <a href="https://instagram.com/imthemindset" target="_blank" rel="noopener" class="social">
    Instagram · @imthemindset
  </a>

  <footer>© Mindset, Vendas Alto Ticket</footer>

</div>

<script>
  // ATENÇÃO: troque pelos links reais antes de publicar
  document.getElementById('linkReuniao').href = "https://imthemindset.github.io/sales/";
  document.getElementById('linkEbook').href = "https://hotm.io/XOmrpt";
</script>

</body>
</html>
